<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Foundry Scene Config — darkness playlist UI test</title>
<style>
:root {font-family:system-ui, sans-serif;color:#dfd8c8;background:#17191d}body{margin:0;display:flex;justify-content:center;min-height:700px;align-items:flex-start;padding:25px}.window{width:700px;border:1px solid #775d42;border-radius:8px;background:#282a2e;box-shadow:0 12px 32px #0008}.title{background:#3d342b;padding:15px 18px;font-weight:700;font-size:18px;border-radius:7px 7px 0 0}.tab{background:#343332;padding:12px 18px;color:#e6cea1}.container{padding:12px 18px}label{display:block;margin:8px 0;line-height:2;font-weight:500}select,input{display:block;box-sizing:border-box;width:100%;padding:8px;margin:4px 0 12px;background:#15181c;color:#f2eade;border:1px solid #746955;border-radius:4px}summary{font-weight:650;cursor:pointer;color:#f0dfbd;padding:4px}.hint{font-size:13px;color:#bdb5a5;line-height:1.5}button{background:#65543c;color:white;border:1px solid #987e54;padding:10px 18px;border-radius:4px}#test-status{font-size:14px;color:#b6dbc0}
</style></head><body><div class="window"><div class="title">Scene Configuration — Dorchester House Exterior</div><div class="tab">Basic &nbsp; | &nbsp; Grid &nbsp; | &nbsp; Lighting &nbsp; | &nbsp; Sound</div><div class="container">
<form id="scene-form"><div class="form-group"><label>Scene Playlist<select name="playlist"><option value="daydaydaydayday1" selected>Dorchester House — Daytime Ambience</option></select></label></div></form>
<p id="test-status">Offline UI integration test</p><button id="apply">Save settings (test only)</button>
</div></div>
<script>
window.__hooks=new Map();window.Hooks={on(n,fn){const a=window.__hooks.get(n)||[];a.push(fn);window.__hooks.set(n,a)},once(n,fn){this.on(n,fn)}};
window.foundry={applications:{sheets:{SceneConfig:class SceneConfig{}}}};
window.__log=[];
function playlist(id,name,mode=2){return {id,name,mode,playing:false,
 async playAll(){this.playing=true;window.__log.push('play:'+id)},
 async playNext(){this.playing=true;window.__log.push('next:'+id)},
 async playSound(sound){this.playing=true;window.__log.push('sound:'+id+':'+sound.id)},
 async stopAll(){this.playing=false;window.__log.push('stop:'+id)}}}
const day=playlist('daydaydaydayday1','Dorchester House — Daytime Ambience');day.fade=1500;
const night=playlist('nightnightnight1','Dorchester House — Nighttime Ambience');night.fade=2500;
const mystery=playlist('mysteryshuffle01','Mystery Investigation After Dark',1);
const sequential=playlist('sequentialtrack1','Unanswered Questions',0);
const board=playlist('soundboardnight1','Chime & Ominous Bells',-1);
board.sounds={contents:[{id:'onetrackbell0001',name:'Ominous Clock Chime'},{id:'onetrackbuzz0001',name:'Unreliable Security Buzzer'}]};
const cinematic=playlist('cinematicambi001','Cinematic Tension',2);
const gm={id:'gm',isGM:true,active:true};
window.__scene={id:'S1',documentName:'Scene',active:true,playlist:day.id,environment:{darknessLevel:0},flags:{'dg-house-rules':{}},getFlag(scope,key){return this.flags[scope]?.[key]}};
window.game={user:gm,users:{activeGM:gm,contents:[gm]},system:{id:'deltagreen'},scenes:{active:window.__scene},playlists:{get(id){return this.contents.find(p=>p.id===id)},contents:[day,night,mystery,sequential,board,cinematic]},settings:{register(){},get(){return true}},actors:{}};
</script>
<script type="module">
import '../scripts/main.js';
const app=new foundry.applications.sheets.SceneConfig();app.document=window.__scene;
for (const fn of window.__hooks.get('renderSceneConfig')||[])fn(app,document.getElementById('scene-form'));
for (const fn of window.__hooks.get('renderApplicationV2')||[])fn(app,document.getElementById('scene-form'));
const pickerStyle=document.querySelector('link[data-dg-house-rules-picker-style="true"]');
if(!pickerStyle)throw Error('Module did not inject stylesheet on demand');
await new Promise((resolve,reject)=>{
  if(pickerStyle.sheet)return resolve();
  pickerStyle.addEventListener('load',resolve,{once:true});
  pickerStyle.addEventListener('error',()=>reject(Error('Module styles failed to load')),{once:true});
});
const section=document.querySelector('[data-dg-house-rules-darkness]');
if(!section || document.querySelectorAll('[data-dg-house-rules-darkness]').length!==1)throw Error('SceneConfig settings missing or duplicated');
section.open=true;
const select=document.querySelector('[name="flags.dg-house-rules.darknessPlaylist"]');
const threshold=document.querySelector('[name="flags.dg-house-rules.darknessThreshold"]');
const transition=document.querySelector('[name="flags.dg-house-rules.darknessCrossfade"]');
if(!transition || transition.value!=='true')throw Error('Default crossfade setting is missing or disabled');
if(!select || !threshold)throw Error('Field names not valid for Scene flags');
select.value='nightnightnight1';threshold.value='0.5';
select.dispatchEvent(new Event('change',{bubbles:true}));
if(!section.textContent.includes('Current daytime: 1.5s; nighttime: 2.5s'))
  throw Error('Current native playlist fade durations missing');
const picker=document.querySelector('.dg-house-rules-picker');
const trigger=picker?.querySelector('.dg-house-rules-picker-trigger');
const popup=picker?.querySelector('.dg-house-rules-picker-popup');
const playlistSearch=picker?.querySelector('[aria-label="Search nighttime playlists"]');
const soundboardSelect=document.querySelector('[aria-label="Nighttime soundboard track"]');
const list=picker?.querySelector('[role="listbox"]');
const icon=picker?.querySelector('.dg-house-rules-picker-search-row svg');
if(!picker || !trigger || !popup || !playlistSearch || !soundboardSelect || !icon)
  throw Error('Integrated popup or its magnifying-glass icon missing');
if(!popup.hidden || !select.classList.contains('dg-house-rules-picker-value'))
  throw Error('Dropdown should start closed with native value field hidden');
if(getComputedStyle(select).display!=='none')throw Error('Native value selector is still visible');
if(select.options.length!==7)throw Error('All four Foundry modes must be available, plus disabled');
const boardLabel=soundboardSelect.closest('label');
if(!boardLabel.hidden || getComputedStyle(boardLabel).display!=='none')
  throw Error('Soundboard picker visible when a normal playlist is selected');
window.__choosePlaylist=(id)=>{
  if(popup.hidden)trigger.click();
  const option=[...list.querySelectorAll('.dg-house-rules-picker-option')]
    .find(b=>b.dataset.playlistId===id);
  if(!option)throw Error('Playlist option missing: '+id);
  option.click();
};
window.__verifySearch=()=>{
  const before=select.value;
  // Opening the dropdown focuses the magnifying-glass search row inside it.
  trigger.click();
  if(popup.hidden || trigger.getAttribute('aria-expanded')!=='true' ||
     document.activeElement!==playlistSearch)throw Error('Popup did not open and focus internal search');
  playlistSearch.value='question';playlistSearch.dispatchEvent(new Event('input',{bubbles:true}));
  if(select.value!==before || ![...list.querySelectorAll('[role="option"]')]
      .some(o=>o.textContent.includes('Unanswered Questions')))
    throw Error('Integrated search lost selection or missed sequential playlist');
  if([...list.querySelectorAll('[role="option"]')]
      .some(o=>o.textContent.includes('Cinematic Tension')))
    throw Error('Integrated search failed to hide unrelated playlist');
  playlistSearch.value='zzzzzzzz';playlistSearch.dispatchEvent(new Event('input',{bubbles:true}));
  if(select.value!==before || !list.textContent.includes('No playlists match'))
    throw Error('Zero-results search did not preserve selection');
  playlistSearch.value='';playlistSearch.dispatchEvent(new Event('input',{bubbles:true}));
  if(list.querySelectorAll('[role="option"]').length!==7)
    throw Error('Clearing search failed to restore every playlist');
  playlistSearch.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  if(!popup.hidden || document.activeElement!==trigger)
    throw Error('Escape must close dropdown and restore trigger focus');
  trigger.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));
  if(popup.hidden)throw Error('Keyboard ArrowDown must open picker');
  playlistSearch.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));
  if(document.activeElement?.getAttribute('role')!=='option')
    throw Error('Keyboard ArrowDown must focus a playlist option');
  picker.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  if(!popup.hidden)throw Error('Keyboard Escape failed to close');
  trigger.click();
  document.body.dispatchEvent(new Event('pointerdown',{bubbles:true}));
  if(!popup.hidden)throw Error('Click outside must close dropdown');
};
window.__verifySearch();
window.__formValues=()=>Object.fromEntries(new FormData(document.getElementById('scene-form')));
window.__testRun=async()=>{
  const fields=window.__formValues();
  if(fields['flags.dg-house-rules.darknessPlaylist']!=='nightnightnight1')throw Error('night selector not submitted');
  if(fields['flags.dg-house-rules.darknessThreshold']!=='0.5')throw Error('threshold not submitted');
  if(fields['flags.dg-house-rules.darknessCrossfade']!=='true')throw Error('crossfade option not submitted');
  Object.assign(window.__scene.flags['dg-house-rules'],{darknessPlaylist:fields['flags.dg-house-rules.darknessPlaylist'],darknessThreshold:Number(fields['flags.dg-house-rules.darknessThreshold'])});
  const day=game.playlists.contents[0],night=game.playlists.contents[1];day.playing=true;
  window.__scene.environment.darknessLevel=1;
  for(const fn of window.__hooks.get('updateScene')||[])fn(window.__scene,{environment:{darknessLevel:1}});
  await new Promise(r=>setTimeout(r,30));
  if(day.playing || !night.playing)throw Error('day to night transition failed');
  window.__scene.environment.darknessLevel=0;
  for(const fn of window.__hooks.get('updateScene')||[])fn(window.__scene,{'environment.darknessLevel':0});
  await new Promise(r=>setTimeout(r,30));
  if(!day.playing || night.playing || window.__scene.playlist!==day.id)throw Error('night to day transition failed');
  // Exercise Shuffle and Soundboard through the registered Foundry Scene hook.
  window.__choosePlaylist(mystery.id);
  window.__scene.flags['dg-house-rules'].darknessPlaylist=mystery.id;
  window.__scene.environment.darknessLevel=1;
  for(const fn of window.__hooks.get('updateScene')||[])fn(window.__scene,{environment:{darknessLevel:1}});
  await new Promise(r=>setTimeout(r,30));
  if(!mystery.playing || !window.__log.includes('next:'+mystery.id))throw Error('Shuffle mode must use playNext');
  window.__choosePlaylist(board.id);
  if(soundboardSelect.closest('label').hidden || getComputedStyle(soundboardSelect.closest('label')).display==='none' || soundboardSelect.options.length!==3)throw Error('Soundboard track picker not shown');
  soundboardSelect.value='onetrackbell0001';
  window.__scene.flags['dg-house-rules'].darknessPlaylist=board.id;
  window.__scene.flags['dg-house-rules'].darknessPlaylistSound=soundboardSelect.value;
  for(const fn of window.__hooks.get('updateScene')||[])fn(window.__scene,{flags:{'dg-house-rules':{darknessPlaylist:board.id}}});
  await new Promise(r=>setTimeout(r,30));
  if(mystery.playing || !board.playing || !window.__log.includes('sound:'+board.id+':onetrackbell0001'))throw Error('Soundboard must play only selected track');
  window.__scene.environment.darknessLevel=0;
  for(const fn of window.__hooks.get('updateScene')||[])fn(window.__scene,{environment:{darknessLevel:0}});
  await new Promise(r=>setTimeout(r,30));
  if(board.playing || !day.playing)throw Error('Soundboard to day transition failed');
  window.__choosePlaylist(night.id);
  window.__scene.flags['dg-house-rules'].darknessPlaylist=night.id;
  window.__scene.flags['dg-house-rules'].darknessPlaylistSound='';
  trigger.click();
  playlistSearch.value='mystery';playlistSearch.dispatchEvent(new Event('input',{bubbles:true}));
  if(popup.hidden || !list.textContent.includes('Mystery Investigation After Dark'))
    throw Error('Final expanded dropdown preview did not filter to mystery');
  document.getElementById('test-status').textContent='PASS: search + all modes + day/night transitions';
  window.__done=true;
};
window.__ready=true;
</script></body></html>

name: Validate and release Foundry module

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module JavaScript
        run: npm run check
      - name: Test feature behaviour
        run: npm test
      - name: Validate Foundry release package
        run: python3 tools/package_release.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce tag and manifest version alignment
        run: python3 tools/package_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish Foundry release manifest and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/module.json \
            dist/dg-house-rules.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
